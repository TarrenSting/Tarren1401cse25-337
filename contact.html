<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    >

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@300;400;600&display=swap"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                KOENIGSEGG<span>.</span>
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNav"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="about.html">
                            About
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="models.html">
                            Models
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="technology.html">
                            Technology
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="records.html">
                            Records
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="gallery.html">
                            Gallery
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="contact.html">
                            Contact
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- Page Header -->
    <section class="page-header">

        <div class="container">

            <h1>Enquiry & Feedback</h1>

            <p>
                Connect with the Koenigsegg team
            </p>

        </div>

    </section>

    <!-- Contact Form -->
    <section class="container my-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="contact-form">

                    <form
                        id="feedbackForm"
                        action="#"
                        method="POST"
                    >

                        <!-- Full Name -->
                        <div class="mb-3">

                            <label class="form-label">
                                Full Name *
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="fullname"
                                required
                                pattern="[A-Za-z ]{3,}"
                                title="At least 3 letters"
                            >

                        </div>

                        <!-- Email -->
                        <div class="mb-3">

                            <label class="form-label">
                                Email *
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                name="email"
                                required
                            >

                        </div>

                        <!-- Phone -->
                        <div class="mb-3">

                            <label class="form-label">
                                Phone (optional)
                            </label>

                            <input
                                type="tel"
                                class="form-control"
                                name="phone"
                                pattern="[0-9+\-\s]{8,}"
                                title="Valid phone number"
                            >

                        </div>

                        <!-- Subject -->
                        <div class="mb-3">

                            <label class="form-label">
                                Subject *
                            </label>

                            <select
                                class="form-select"
                                name="subject"
                                required
                            >

                                <option value="">
                                    Select...
                                </option>

                                <option>
                                    Enquiry
                                </option>

                                <option>
                                    Media
                                </option>

                                <option>
                                    Career
                                </option>

                                <option>
                                    General
                                </option>

                            </select>

                        </div>

                        <!-- Message -->
                        <div class="mb-3">

                            <label class="form-label">
                                Message *
                                (minimum 20 characters)
                            </label>

                            <textarea
                                class="form-control"
                                rows="5"
                                name="message"
                                required
                                minlength="20"
                            ></textarea>

                        </div>

                        <!-- Preferred Contact -->
                        <div class="mb-3">

                            <label class="form-label me-3">
                                Preferred Contact:
                            </label>

                            <div class="form-check form-check-inline">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="contactMethod"
                                    value="Email"
                                    checked
                                >

                                <label class="form-check-label">
                                    Email
                                </label>

                            </div>

                            <div class="form-check form-check-inline">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="contactMethod"
                                    value="Phone"
                                >

                                <label class="form-check-label">
                                    Phone
                                </label>

                            </div>

                        </div>

                        <!-- Newsletter -->
                        <div class="mb-3 form-check">

                            <input
                                type="checkbox"
                                class="form-check-input"
                                name="newsletter"
                            >

                            <label class="form-check-label">
                                Subscribe to Koenigsegg newsletter
                            </label>

                        </div>

                        <!-- Submit Button -->
                        <button
                            type="submit"
                            class="btn btn-primary-red"
                        >

                            Submit Enquiry

                            <i class="fas fa-paper-plane ms-2"></i>

                        </button>

                    </form>

                    <!-- Success Message -->
                    <div
                        id="formSuccess"
                        class="alert alert-success mt-4 d-none"
                    >

                        Thank you!
                        Your enquiry has been received.

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- Footer -->
    <footer>

        <div class="container text-center">

            <p class="small">
                &copy; 2026 Koenigsegg Automotive AB
            </p>

        </div>

    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Form Validation -->
    <script>

        document
            .getElementById('feedbackForm')
            .addEventListener('submit', function (e) {

                e.preventDefault();

                if (this.checkValidity()) {

                    document
                        .getElementById('formSuccess')
                        .classList.remove('d-none');

                    this.reset();

                    setTimeout(() => {

                        document
                            .getElementById('formSuccess')
                            .classList.add('d-none');

                    }, 4000);

                } else {

                    this.reportValidity();

                }

            });

    </script>

</body>
</html>
